services:
  - type: web
    name: rup-backend
    runtime: node
    rootDir: .
    buildCommand: npm install && npx prisma generate --schema=models/prisma/schema.prisma && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - fromDatabase:
          name: rup-db
          property: connectionString
        key: DATABASE_URL
      - key: JWT_SECRET
        sync: false
      - key: API_KEY_SALT
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENTRYON_URL
        sync: false
      - key: KLING_API_KEY
        sync: false
      - key: KLING_API_URL
        value: https://api-singapore.klingai.com
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: FROM_EMAIL
        value: noreply@rup.app
    healthCheckPath: /health
    autoDeploy: true

databases:
  - name: rup-db
    plan: starter
    databaseName: rup
    user: rup
